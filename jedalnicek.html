<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#b0355c">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta property="og:type" content="website">
<meta property="og:title" content="🗓️ Jedálniček na týždeň">
<meta property="og:description" content="Týždenný plán varenia zo zbierky receptov + nákupný zoznam pre Rohlík.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-192.png">
<title>Jedálniček na týždeň</title>
<style>
  :root{--bg:#fbf6f7;--card:#fff;--ink:#2d2a26;--muted:#6c6266;--accent:#b0355c;--chip:#f3e3e9;--chip-on:#b0355c;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Georgia,'Times New Roman',serif;background:var(--bg);color:var(--ink)}
  .wrap{max-width:760px;margin:0 auto;padding:0 24px 80px}
  header{padding:36px 0 6px;text-align:center}
  header h1{font-size:2rem;font-weight:400}
  header p{color:var(--muted);margin-top:6px;font-style:italic}
  .back{display:inline-block;margin-top:26px;font-family:system-ui,sans-serif;font-size:.85rem;color:var(--accent);text-decoration:none}
  .back:hover{text-decoration:underline}

  .ovladanie{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin:18px 0 8px;font-family:system-ui,sans-serif;font-size:.85rem}
  .ovladanie label{display:flex;gap:6px;align-items:center;cursor:pointer}
  .chipbtn{font-family:system-ui,sans-serif;font-size:.85rem;padding:7px 15px;border-radius:999px;background:var(--chip);border:none;cursor:pointer;color:var(--ink)}
  .chipbtn.on{background:var(--chip-on);color:#fff}
  .primary{font-family:system-ui,sans-serif;background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:999px;cursor:pointer;font-weight:600;font-size:.88rem}
  .ghost{font-family:system-ui,sans-serif;background:none;border:1px solid #e2d3da;padding:9px 18px;border-radius:999px;cursor:pointer;font-size:.85rem;color:var(--ink)}
  .ghost:hover{border-color:var(--accent)}

  h2.sekcia{font-size:1.25rem;font-weight:500;margin:30px 0 12px;display:flex;align-items:center;gap:12px}
  h2.sekcia::after{content:"";flex:1;height:2px;background:var(--chip);border-radius:2px}

  .den{background:var(--card);border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.07);display:flex;align-items:center;gap:14px;padding:10px 14px 10px 10px;margin-bottom:10px}
  .den img{width:72px;height:72px;object-fit:cover;border-radius:10px;background:#eee;flex-shrink:0}
  .den .info{flex:1;min-width:0}
  .den .dname{font-family:system-ui,sans-serif;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .den a{color:inherit;text-decoration:none;font-weight:600;font-size:1.02rem;line-height:1.3;display:block;margin:2px 0 4px}
  .den a:hover{color:var(--accent)}
  .den .meta{font-family:system-ui,sans-serif;font-size:.72rem;color:var(--muted)}
  .swap{font-size:1.05rem;background:var(--chip);border:none;border-radius:50%;width:40px;height:40px;cursor:pointer;flex-shrink:0}
  .swap:hover{background:var(--chip-on);color:#fff}

  .zoznam{background:var(--card);border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.07);padding:20px 22px;font-family:system-ui,sans-serif}
  .zoznam .grp{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:12px 0 2px}
  .zoznam ul{list-style:none}
  .zoznam li{padding:6px 0;border-bottom:1px dashed #e8dae1;font-size:.9rem}
  .zoznam li.sp{color:var(--muted)}
  .zoznam label{display:flex;gap:8px;align-items:center;font-size:.85rem;cursor:pointer;margin-bottom:6px}
  .zoznam .row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
  .hint{font-size:.78rem;color:var(--muted);margin-top:12px}
  .empty{text-align:center;color:var(--muted);padding:30px;font-style:italic}
  footer{text-align:center;color:var(--muted);font-size:.8rem;padding:40px 0 30px;font-family:system-ui,sans-serif}

  @media (max-width:700px){
    .wrap{padding:0 16px 70px}
    header{padding:24px 0 0}
    header h1{font-size:1.6rem}
  }
  @media (prefers-color-scheme: dark){
    :root{--bg:#211a1e;--card:#2d242a;--ink:#efe6ea;--muted:#a89aa1;--chip:#3b2e35;--chip-on:#b0355c;}
    .den,.zoznam{box-shadow:0 1px 4px rgba(0,0,0,.45)}
    .ghost{border-color:#4c3d45;color:var(--ink)}
    .zoznam li{border-color:#4c3d45}
    .back{color:#e58fae}
  }
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="index.html">← všetky recepty</a>
<header>
  <h1>🗓️ Jedálniček na týždeň</h1>
  <p>plán varenia zo zbierky + nákupný zoznam</p>
</header>

<div class="ovladanie">
  <button class="chipbtn" id="d5">5 dní</button>
  <button class="chipbtn on" id="d7">7 dní</button>
  <label><input type="checkbox" id="polievky" checked> + 2 polievky</label>
  <label><input type="checkbox" id="overene"> len vyskúšané a osvedčené</label>
  <button class="primary" id="gen">🔀 Vygenerovať znova</button>
</div>

<h2 class="sekcia">Hlavné jedlá</h2>
<div id="dni"></div>

<div id="psekcia">
  <h2 class="sekcia">Polievky na týždeň</h2>
  <div id="pol"></div>
</div>

<h2 class="sekcia">🛒 Nákupný zoznam</h2>
<div class="zoznam">
  <label><input type="checkbox" id="spajza"> zahrnúť aj bežné suroviny (soľ, voda, olej…)</label>
  <div id="zlist"></div>
  <div class="row"><button class="primary" id="copy">📋 Kopírovať pre Rohlík</button></div>
  <div class="hint">Skopírovaný text je hotový prompt — stačí vložiť AI asistentovi na Rohlik.cz a odoslať.</div>
</div>

<footer>created by marty · 2026</footer>
</div>

<script src="data.js"></script>
<script>
const el=id=>document.getElementById(id);
const DNI=["Pondelok","Utorok","Streda","Štvrtok","Piatok","Sobota","Nedeľa"];
const VAHA={"osvedčené":4,"vyskúšané":2,"nové":1};
let nast={dni:7,polievky:true,overene:false};
let plan=[],polievkyPlan=[];

/* uložený plán prežije obnovenie stránky */
try{
  const s=JSON.parse(localStorage.getItem("recepty_jedalnicek")||"null");
  if(s){nast=s.nast;
    plan=s.plan.map(id=>RECEPTY.find(r=>r.id===id)).filter(Boolean);
    polievkyPlan=s.pol.map(id=>RECEPTY.find(r=>r.id===id)).filter(Boolean);}
}catch(e){}

function uloz(){try{localStorage.setItem("recepty_jedalnicek",JSON.stringify(
  {nast,plan:plan.map(r=>r.id),pol:polievkyPlan.map(r=>r.id)}));}catch(e){}}

function pool(chod){
  let p=RECEPTY.filter(r=>r.chod===chod);
  if(nast.overene){const o=p.filter(r=>r.stav!=="nové");if(o.length>=3)p=o;}
  return p;
}
/* vážený náhodný výber bez opakovania */
function vyber(zoz,n,pouzite){
  const vys=[];let kand=zoz.filter(r=>!pouzite.has(r.id));
  while(vys.length<n&&kand.length){
    const sucet=kand.reduce((a,r)=>a+VAHA[r.stav],0);
    let x=Math.random()*sucet,i=0;
    while(i<kand.length-1&&(x-=VAHA[kand[i].stav])>0)i++;
    vys.push(kand[i]);pouzite.add(kand[i].id);kand.splice(i,1);
  }
  return vys;
}
/* zoradiť tak, aby po sebe nešli dni s rovnakou hlavnou surovinou */
function preusporiadaj(zoz){
  for(let i=1;i<zoz.length;i++){
    const a=zoz[i-1].surovina[0],b=zoz[i].surovina[0];
    if(a&&b&&a===b){
      const j=zoz.findIndex((r,k)=>k>i&&r.surovina[0]!==a);
      if(j>-1)[zoz[i],zoz[j]]=[zoz[j],zoz[i]];
    }
  }
  return zoz;
}
function generuj(){
  const pouzite=new Set();
  plan=preusporiadaj(vyber(pool("hlavné jedlo"),nast.dni,pouzite));
  polievkyPlan=nast.polievky?vyber(pool("polievka"),2,pouzite):[];
  uloz();render();
}
function vymen(zoz,i,chod){
  const pouzite=new Set([...plan,...polievkyPlan].map(r=>r.id));
  const novy=vyber(pool(chod),1,pouzite);
  if(novy.length){zoz[i]=novy[0];uloz();render();}
}

function riadok(r,dname,fn){
  const d=document.createElement("div");d.className="den";
  d.innerHTML='<img src="'+esc(r.obrazok)+'" alt="" loading="lazy">'+
    '<div class="info"><div class="dname">'+esc(dname)+'</div>'+
    '<a href="'+esc(r.id)+'.html">'+esc(r.nazov)+'</a>'+
    '<div class="meta">⏱️ '+r.cas+' min · '+esc(r.stav)+(r.dieta.length?' · '+r.dieta.map(esc).join(", "):"")+'</div></div>'+
    '<button class="swap" title="vymeniť recept" aria-label="vymeniť recept">🔄</button>';
  d.querySelector(".swap").onclick=fn;
  return d;
}
function render(){
  el("d5").classList.toggle("on",nast.dni===5);el("d7").classList.toggle("on",nast.dni===7);
  el("polievky").checked=nast.polievky;el("overene").checked=nast.overene;
  const dniEl=el("dni");dniEl.innerHTML="";
  if(!plan.length)dniEl.innerHTML='<div class="empty">Klikni na 🔀 Vygenerovať</div>';
  plan.forEach((r,i)=>dniEl.appendChild(riadok(r,DNI[i]||"Deň "+(i+1),()=>vymen(plan,i,"hlavné jedlo"))));
  el("psekcia").style.display=nast.polievky&&polievkyPlan.length?"block":"none";
  const polEl=el("pol");polEl.innerHTML="";
  polievkyPlan.forEach((r,i)=>polEl.appendChild(riadok(r,"Polievka "+(i+1),()=>vymen(polievkyPlan,i,"polievka"))));
  renderZoznam();
}
function vsetky(){return[...plan,...polievkyPlan];}
function renderZoznam(){
  const so=el("spajza").checked,rs=vsetky();
  el("zlist").innerHTML=rs.length?rs.map(r=>
    '<div class="grp">'+esc(r.nazov)+'</div><ul>'+
    r.suroviny.filter(s=>so||!s.s).map(s=>'<li class="'+(s.s?"sp":"")+'">'+esc(s.t)+"</li>").join("")+"</ul>"
  ).join(""):'<div class="empty">Najprv vygeneruj jedálniček</div>';
}
el("copy").onclick=e=>{
  const so=el("spajza").checked,rs=vsetky();
  if(!rs.length)return;
  let txt="Nakúp mi prosím suroviny na jedálniček na týždeň (recepty: "+rs.map(r=>r.nazov).join(", ")+"):\n";
  rs.forEach(r=>r.suroviny.filter(s=>so||!s.s).forEach(s=>txt+="- "+s.t+" ("+r.nazov+")\n"));
  txt+="Rovnaké suroviny zlúč do jednej položky. Ak niečo nie je dostupné, navrhni najbližšiu alternatívu.";
  navigator.clipboard.writeText(txt).then(()=>{
    e.target.style.minWidth=e.target.offsetWidth+"px";
    e.target.textContent="✓ Skopírované";
    setTimeout(()=>e.target.textContent="📋 Kopírovať pre Rohlík",1800);
  });
};
el("spajza").onchange=renderZoznam;
el("d5").onclick=()=>{nast.dni=5;plan=plan.slice(0,5);uloz();render();};
el("d7").onclick=()=>{if(nast.dni!==7){nast.dni=7;generuj();}};
el("polievky").onchange=e=>{nast.polievky=e.target.checked;
  if(nast.polievky&&!polievkyPlan.length){const p=new Set(plan.map(r=>r.id));polievkyPlan=vyber(pool("polievka"),2,p);}
  uloz();render();};
el("overene").onchange=e=>{nast.overene=e.target.checked;generuj();};
el("gen").onclick=generuj;

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
if(!plan.length)generuj();else render();

if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
